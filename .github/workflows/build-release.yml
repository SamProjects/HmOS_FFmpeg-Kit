name: HarmonyOS HAR build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after all checks pass
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hmos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  housekeeping:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Remove artifacts and former build caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-actions-storage.sh
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/build-ohos.sh scripts/build-deps.sh scripts/test-native.sh scripts/cleanup-actions-storage.sh
  media-test:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y build-essential nasm ffmpeg gnupg
      - name: Exercise media pipeline with sanitizers and timing checks
        run: bash scripts/test-native.sh
  build-release:
    needs: [verify, media-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config gnupg libgl1 unzip openjdk-17-jre-headless
      - name: Prepare pinned HarmonyOS SDK
        run: python3 scripts/setup-sdk.py
      - name: Build all ABIs and validate single-ABI and universal HAR consumers
        run: |
          for profile in core extended; do
            for abi in arm64-v8a x86_64; do
              export HMOS_ABI="$abi"
              bash scripts/build-ohos.sh "$profile"
              python3 scripts/build-har.py "$profile"
              python3 scripts/release-assets.py "$profile"
            done
            python3 scripts/build-har.py "$profile" --universal
          done
      - name: Verify both release packages
        run: python3 scripts/check-release.py dist/assets
      - name: Publish directly from this runner to Release
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("config/project.json"))["version"])')
          tag="v${version}-ci.${GITHUB_RUN_NUMBER}"
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          (cd dist/assets; sha256sum *.har *.tar.gz *.json > SHA256SUMS)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            target=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            [[ "$draft" == true && "$target" == "$GITHUB_SHA" ]] || {
              echo 'Refusing to overwrite an existing published or unrelated release'; exit 1;
            }
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --prerelease --title "HmOS FFmpeg $tag" \
              --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$tag" dist/assets/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
      - name: Remove temporary files on the runner
        if: always()
        run: python3 scripts/cleanup-runner.py
  cleanup-storage:
    needs: [housekeeping, verify, media-test, build-release]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Ensure no artifacts or former build caches remain
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-actions-storage.sh
