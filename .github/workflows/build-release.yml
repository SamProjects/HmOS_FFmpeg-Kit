name: HarmonyOS HAR build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after both HAR builds pass
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hmos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/build-ohos.sh scripts/build-deps.sh
  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [core, extended]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config gnupg libgl1 unzip
      - name: Prepare pinned HarmonyOS SDK
        run: python3 scripts/setup-sdk.py
      - name: Cross compile FFmpeg and NAPI bridge
        run: bash scripts/build-ohos.sh "${{ matrix.profile }}"
      - name: Build HAR and a consumer HAP
        run: python3 scripts/build-har.py "${{ matrix.profile }}"
      - name: Package SDK, symbols and corresponding sources
        run: python3 scripts/release-assets.py "${{ matrix.profile }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.profile }}
          path: dist/assets/*
          if-no-files-found: error
      - name: Preserve diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ matrix.profile }}
          path: |
            work/build/**/*.log
            work/build/**/config.h
            work/build/**/configure-args.txt
            work/har/**/build/**/build.log
            work/har/**/.hvigor/**/hvigor.log
            work/sdk.json
          if-no-files-found: ignore
  release:
    needs: [verify, build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) || github.event_name == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: release-dist
      - name: Publish validated SDK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/check-release.py release-dist
          version=$(python3 -c 'import json; print(json.load(open("config/project.json"))["version"])')
          tag="v${version}-ci.${GITHUB_RUN_NUMBER}"
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          (cd release-dist; sha256sum *.har *.tar.gz *-manifest.json > SHA256SUMS)
          gh release create "$tag" release-dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "HmOS FFmpeg $tag" \
            --notes-file docs/RELEASE-NOTES.md
