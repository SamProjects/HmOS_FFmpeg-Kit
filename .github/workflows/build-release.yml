name: HarmonyOS HAR build and release
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/recover-release.yml']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after all checks pass
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hmos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  housekeeping:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Remove artifacts and former build caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-actions-storage.sh
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/build-ohos.sh scripts/build-deps.sh scripts/test-native.sh scripts/cleanup-actions-storage.sh scripts/install-ci-deps.sh scripts/prepare-release.sh scripts/publish-release.sh
  media-test:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/install-ci-deps.sh media
      - name: Exercise media pipeline with sanitizers and timing checks
        run: bash scripts/test-native.sh
  build-release:
    needs: [verify, media-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 提前检查发布权限并固定源码标签
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/prepare-release.sh
      - name: Install build dependencies
        run: bash scripts/install-ci-deps.sh build
      - name: Prepare pinned HarmonyOS SDK
        run: python3 scripts/setup-sdk.py
      - name: Build core ARM64 SDK and HAR
        env:
          HMOS_ABI: arm64-v8a
        run: |
          bash scripts/build-ohos.sh core
          python3 scripts/build-har.py core
          python3 scripts/release-assets.py core
          python3 scripts/cleanup-profile.py core
      - name: Build core x86_64 SDK and HAR
        env:
          HMOS_ABI: x86_64
        run: |
          bash scripts/build-ohos.sh core
          python3 scripts/build-har.py core
          python3 scripts/release-assets.py core
          python3 scripts/cleanup-profile.py core
      - name: Build core universal HAR and validate three consumer ABI selections
        run: python3 scripts/build-har.py core --universal
      - name: Build extended ARM64 SDK and HAR
        env:
          HMOS_ABI: arm64-v8a
        run: |
          bash scripts/build-ohos.sh extended
          python3 scripts/build-har.py extended
          python3 scripts/release-assets.py extended
          python3 scripts/cleanup-profile.py extended
      - name: Build extended x86_64 SDK and HAR
        env:
          HMOS_ABI: x86_64
        run: |
          bash scripts/build-ohos.sh extended
          python3 scripts/build-har.py extended
          python3 scripts/release-assets.py extended
          python3 scripts/cleanup-profile.py extended
      - name: Build extended universal HAR and validate three consumer ABI selections
        run: python3 scripts/build-har.py extended --universal
      - name: Verify both release packages
        run: python3 scripts/check-release.py dist/assets
      - name: Publish directly from this runner to Release
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
      - name: Remove temporary files on the runner
        if: always()
        run: python3 scripts/cleanup-runner.py
  cleanup-storage:
    needs: [housekeeping, verify, media-test, build-release]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Ensure no artifacts or former build caches remain
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-actions-storage.sh
