name: HarmonyOS HAR build and release
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/recover-release.yml']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      command_test:
        description: 包含 execute 命令接口（已通过模拟器测试，手机待验证）
        type: boolean
        default: true
      publish:
        description: Publish a prerelease after all checks pass
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hmos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  housekeeping:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Remove artifacts and former build caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-actions-storage.sh
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/build-ohos.sh scripts/build-deps.sh scripts/test-native.sh scripts/cleanup-actions-storage.sh scripts/install-ci-deps.sh scripts/prepare-release.sh scripts/publish-release.sh scripts/test-command-host.sh
  media-test:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash scripts/install-ci-deps.sh media
      - name: Exercise media pipeline with sanitizers and timing checks
        run: bash scripts/test-native.sh
      - name: 验证实验命令引擎的连续调用、错误、取消与超时
        if: github.event_name != 'workflow_dispatch' || inputs.command_test
        run: bash scripts/test-command-host.sh
  build-release:
    needs: [verify, media-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HMOS_HAR_ONLY: "1"
      HMOS_COMMAND_TEST: ${{ (github.event_name != 'workflow_dispatch' || inputs.command_test) && '1' || '0' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 提前检查发布权限并固定源码标签
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/prepare-release.sh
      - name: Install build dependencies
        run: bash scripts/install-ci-deps.sh build
      - name: Prepare pinned HarmonyOS SDK
        run: python3 scripts/setup-sdk.py
      - name: 编译 extended ARM64 运行库
        env:
          HMOS_ABI: arm64-v8a
        run: |
          bash scripts/build-ohos.sh extended
          python3 scripts/cleanup-profile.py extended
      - name: 编译 extended x86_64 运行库
        env:
          HMOS_ABI: x86_64
        run: |
          bash scripts/build-ohos.sh extended
          python3 scripts/cleanup-profile.py extended
      - name: 生成 extended 全架构 HAR 并验证消费工程
        run: python3 scripts/build-har.py extended --universal
      - name: 校验唯一发布的全架构 HAR
        run: python3 scripts/check-release.py dist/assets
      - name: Publish directly from this runner to Release
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
      - name: Remove temporary files on the runner
        if: always()
        run: python3 scripts/cleanup-runner.py
  cleanup-storage:
    needs: [housekeeping, verify, media-test, build-release]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Ensure no artifacts or former build caches remain
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cleanup-actions-storage.sh
