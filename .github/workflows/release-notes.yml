name: 同步中文发布说明
on:
  workflow_run:
    workflows: ['HarmonyOS HAR build and release']
    types: [completed]
permissions:
  contents: write
jobs:
  chinese-notes:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # Use trusted main, not code from a triggering PR. This also applies the
      # Chinese template to an already-running build without cancelling it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: 更新本次构建对应版本的中文标题与说明
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
            jq -r --arg source "$SOURCE_SHA" '.[] | select(.draft == false and .target_commitish == $source) | .tag_name')
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "鸿蒙 FFmpeg $tag（预发布版）" --notes-file docs/RELEASE-NOTES.md
          done <<< "$tags"
